<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TOPP">
  <defs>
    <linearGradient id="accent" x1="96" y1="120" x2="416" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
  </defs>
  <!-- near-black rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.45"/>
  <!-- portfolio "T": serif-strong top bar + descending stem, drawn in the accent gradient -->
  <g fill="url(#accent)">
    <rect x="128" y="150" width="256" height="44" rx="22"/>
    <rect x="234" y="150" width="44" height="232" rx="22"/>
  </g>
  <!-- stacked "pages" beneath the T to read as a portfolio/document -->
  <g fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="178" y1="398" x2="334" y2="398"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" opacity="0.55">
    <line x1="196" y1="430" x2="316" y2="430"/>
  </g>
</svg>
